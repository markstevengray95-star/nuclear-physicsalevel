name: Validate Nuclear Physics Lab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s lesson-sequencer.css
          test -s lesson-sequencer.js
          test -s simulation-upgrades.css
          test -s simulation-upgrades.js
          test -s interactive-lessons.css
          test -s interactive-lessons.js
          test -s mastery-upgrades.css
          test -s mastery-upgrades.js
          test -s rutherford-experiment.css
          test -s rutherford-experiment.js
          test -s vendor/three.module.min.js
          test -s vendor/three.core.min.js
          test -s learning-platform.css
          test -s lesson-depth.css
          test -s lesson-depth.js
          test -s complete-lesson-notes.css
          test -s complete-lesson-notes.js
          test -s learning-platform.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s app-icon.svg
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check lesson-sequencer.js
          node --check simulation-upgrades.js
          node --check interactive-lessons.js
          node --check mastery-upgrades.js
          node --check rutherford-experiment.js
          node --check learning-platform.js
          node --check lesson-depth.js
          node --check complete-lesson-notes.js
          node --check sw.js
      - name: Check integrations
        run: |
          grep -q "lesson-sequencer.js" index.html
          grep -q "simulation-upgrades.js" index.html
          grep -q "interactive-lessons.js" index.html
          grep -q "mastery-upgrades.js" index.html
          grep -q "A\* mastery hub" mastery-upgrades.js
          grep -q "Reinforcement tasks" interactive-lessons.js
          grep -q "Starter / retrieval" interactive-lessons.js
          grep -q "Exam questions" interactive-lessons.js
          grep -q "Knowledge check before you move on" interactive-lessons.js
          grep -q "Guided practice" interactive-lessons.js
          grep -q "Original AQA-style practice" interactive-lessons.js
          grep -q "rutherford-experiment.js" index.html
          grep -q "rutherford-experiment.css" index.html
          grep -q "learning-platform.js" index.html
          grep -q "lesson-depth.js" index.html
          grep -q "lesson-depth.css" index.html
          grep -q "complete-lesson-notes.js" index.html
          grep -q "complete-lesson-notes.css" index.html
          grep -q "Complete lesson reference" complete-lesson-notes.js
          grep -q "Auto-mark entire paper" learning-platform.js
          grep -q "Full-spec teaching" lesson-depth.js
          grep -q "learning-platform.css" index.html
          grep -q "manifest.webmanifest" index.html
          grep -q "Learning dashboard" learning-platform.js
          grep -q "Lesson sequencer" lesson-sequencer.js
          grep -q "Complete student lesson" interactive-lessons.js
          grep -q "eventStage" app.js
          grep -q "excited U-236" app.js
          grep -q "prompt neutrons" app.js
          grep -q "ONE COLLISION" app.js
          grep -q "stable lead-206" app.js
          grep -q "element changes because" app.js
          grep -q "n → p + β⁻ + anti-ν" app.js
          grep -q "REALISTIC DECAY-CHAIN TRANSFORMATION" app.js
          grep -q "chainPhase" app.js
          grep -q "chainStep" app.js
          grep -q "ANIMATED U-238 DECAY SERIES" app.js
          grep -q "Animated decay chain" app.js
          grep -q "fusion: light nuclei" app.js
          grep -q "SEPARATED NUCLEONS" app.js
          grep -q "DENSITY CHECK" app.js
          grep -q "DECAY BOOKKEEPING" app.js
          grep -q "MICROSCOPIC VIEW" app.js
          grep -q "Required practical 12" index.html
